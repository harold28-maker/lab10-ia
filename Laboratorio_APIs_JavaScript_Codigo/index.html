<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratorio de APIs · Pecera</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="pecera.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="curso">GTICS · APIs nativas de JavaScript</p>
      <h1>La pecera de Nemo y Dory</h1>
    </header>
    <div class="laboratorio">
      <section class="pecera" aria-label="Pecera con zonas de Nemo y Dory">
        <div id="tablero"></div>
        <div id="burbujas" aria-label="Burbujas disponibles"></div>
        <div class="zonas">
          <section class="pez nemo" data-pez="nemo" aria-label="Zona de Nemo">
            <span class="icono-pez" aria-hidden="true"></span>
            <h2>Nemo</h2>
            <output id="contador-nemo" aria-label="Conteo de Nemo">0</output>
            <button type="button" class="sumar">Vi un pez</button>
          </section>
          <section class="pez dory" data-pez="dory" aria-label="Zona de Dory">
            <span class="icono-pez" aria-hidden="true"></span>
            <h2>Dory</h2>
            <output id="contador-dory" aria-label="Conteo de Dory">0</output>
            <button type="button" class="sumar">Vi un pez</button>
          </section>
        </div>
      </section>
      <aside>
        <form id="dimensiones">
          <label for="lado">Celdas por lado</label>
          <div class="campo">
            <input type="number" id="lado" min="1" max="24" value="6" required>
            <button type="submit">Aplicar</button>
          </div>
          <p id="medidas"></p>
        </form>
        <hr>
        <h2>Agua</h2>
        <p id="estado-agua"></p>
        <div class="acciones">
          <button type="button" id="limpiar">Limpiar pecera</button>
          <a href="./" target="_blank" rel="noopener">Abrir otro acuario</a>
        </div>
        <hr>
        <h2>Burbujas</h2>
        <p>Arrastra las naranjas a Nemo y las azules a Dory.</p>
        <p id="mensaje" role="status">Aparece una burbuja cada 2 segundos.</p>
      </aside>
    </div>
  </main>
</body>
</html>
